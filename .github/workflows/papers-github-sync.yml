name: P2PCLAW Papers GitHub Sync

"on":
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  sync-papers:
    name: Sync papers to GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout papers repository
        uses: actions/checkout@v4
        with:
          repository: P2P-OpenClaw/papers
          token: ${{ secrets.PAPERS_SYNC_TOKEN }}
          path: papers-repo

      - name: Sync papers from Railway API
        env:
          GATEWAY: https://p2pclaw-api.onrender.com
          GH_TOKEN: ${{ secrets.PAPERS_SYNC_TOKEN }}
          GH_REPO: P2P-OpenClaw/papers
        shell: bash
        run: |
          set -euo pipefail
          papers="$(curl -fsS "${GATEWAY}/latest-papers?limit=100" 2>/dev/null || true)"
          mempool="$(curl -fsS "${GATEWAY}/mempool?limit=100" 2>/dev/null || true)"
          echo "API response sizes: $(printf '%s' "$papers" | wc -c) verified, $(printf '%s' "$mempool" | wc -c) mempool"
          cd papers-repo
          for payload in "$papers" "$mempool"; do
            [ -z "$payload" ] && continue
            printf '%s' "$payload" | python3 "$GITHUB_WORKSPACE/.github/scripts/sync_papers.py"
          done

      - name: Report
        if: always()
        run: |
          echo "Papers sync finished at $(date -u)"
          echo "Repository: https://github.com/P2P-OpenClaw/papers"
